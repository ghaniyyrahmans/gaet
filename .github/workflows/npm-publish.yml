name: Publish NPM Package

# A tag can fire both `push` and `release`; serialize so the version guard below
# always sees the result of the earlier run.
concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

on:
  # Primary trigger. release.yml listens to the same tag, so one tag push builds
  # the binaries and stages the SDK together. A release published with the
  # built-in GITHUB_TOKEN does not trigger other workflows, hence this trigger.
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  # Manual re-publish / retry of a staged release:
  #   gh workflow run npm-publish.yml --ref main -f version=X.Y.Z
  workflow_dispatch:
    inputs:
      version:
        description: "Numeric X.Y.Z version to publish. Defaults to the tag name when run on a tag ref."
        required: false
        type: string

jobs:
  publish:
    name: Build & Publish SDK to NPM
    runs-on: ubuntu-latest
    # id-token: write enables npm Trusted Publishing (OIDC). Publishing uses a
    # short-lived OIDC token (no NPM_TOKEN) via the Trusted Publisher configured
    # for this repo/workflow on npmjs.com.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'   # Node >=22.14 ships npm >=11 with OIDC support
          registry-url: 'https://registry.npmjs.org'

      # Resolve the version: explicit dispatch input, else the tag (strip "v").
      - name: Resolve Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Could not determine a numeric X.Y.Z version (got '${VERSION}')" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved SDK version: $VERSION"

      # Bump sdk/package.json version to match the tag without creating a git commit
      - name: Sync sdk/package.json Version to Tag
        run: |
          cd sdk
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
          echo "sdk/package.json is now at $(node -p "require('./package.json').version")"

      - name: Install Dependencies & Build SDK
        run: |
          cd sdk
          npm ci
          npm run build

      - name: Run SDK Tests
        run: |
          cd sdk
          npm test

      # A re-pushed tag must not fail on an already-published version.
      - name: Check version already published
        id: published
        working-directory: sdk
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if npm view "@ghaniyyrahmans/gaet@${VERSION}" version >/dev/null 2>&1; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi

      # Stage-only trusted publisher: releases require maintainer approval in npm.
      # No NODE_AUTH_TOKEN here; publishing authenticates via OIDC
      # (id-token: write above) using the npm Trusted Publisher configured for
      # this repo/workflow — no long-lived token.
      - name: Publish to NPM (OIDC trusted publishing)
        if: steps.published.outputs.yes != 'true'
        run: |
          cd sdk
          npm stage publish --access public
